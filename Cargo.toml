[package]
name = "officecli"
version = "0.6.0"
edition = "2021"
description = "A Rust port of OfficeCLI: a command-line Office suite for AI agents to read, edit, and automate Word, Excel, and PowerPoint files."
license = "Apache-2.0"
repository = "https://github.com/pariharshyamu/office-agent"

[dependencies]
clap = { version = "4", features = ["derive"] }
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
base64 = "0.22"
tiny-skia = "0.12.0"
ab_glyph = "0.2.32"
jpeg-decoder = { version = "0.3", default-features = false }
gif = "0.13"

[profile.release]
lto = true
strip = true
