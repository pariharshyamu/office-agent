name: Release

on:
  push:
    tags:
      - "v*"
  # Dispatching on a branch releases that branch's HEAD: the release action
  # creates the tag via the API (useful where git tag pushes are blocked).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: officecli-linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            asset: officecli-linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            asset: officecli-mac-arm64
            target: aarch64-apple-darwin
          # Cross-compiled from the Apple-silicon runner (Intel runners
          # are retired); tests run on the arm64 build above instead.
          - os: macos-latest
            asset: officecli-mac-x64
            target: x86_64-apple-darwin
            cross: true
          - os: windows-latest
            asset: officecli-win-x64.exe
            target: x86_64-pc-windows-msvc
          # Cross-compiled with the MSVC toolchain; tests are skipped
          # because x64 runners cannot execute ARM64 binaries.
          - os: windows-latest
            asset: officecli-win-arm64.exe
            target: aarch64-pc-windows-msvc
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Run tests
        if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/officecli"
          [[ "${{ matrix.target }}" == *windows* ]] && src="$src.exe"
          cp "$src" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Note: not "assets" — that is the repo directory with the embedded
      # fonts, which would otherwise get attached to the release too.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach installer scripts
        run: cp install.sh install.ps1 dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            officecli — a Rust implementation of OfficeCLI: a command-line
            Office suite for AI agents. Reads, creates, and edits Word
            (.docx), Excel (.xlsx), and PowerPoint (.pptx) files as a single
            static binary — no Microsoft Office, no runtime dependencies.

            **Commands:** create, view (outline/text/stats/html/screenshot),
            get, query, add (incl. charts, images, comments, footnotes, TOC,
            pivots), set (props, find/replace, transitions, animations),
            move, swap, remove, dump, batch, validate, watch (live preview),
            resident, mcp (Model Context Protocol server), help.

            **Install (Linux/macOS):**
            ```sh
            curl -fsSL https://github.com/pariharshyamu/office-agent/releases/latest/download/install.sh | sh
            ```
            **Install (Windows):**
            ```powershell
            irm https://github.com/pariharshyamu/office-agent/releases/latest/download/install.ps1 | iex
            ```
            Windows binaries are built with the MSVC toolchain (x64 and ARM64).

            Run `officecli help` for the agent-oriented command guide, or
            register it as an MCP server:
            `claude mcp add officecli -- /path/to/officecli mcp`
